<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciales</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="main-container">
        
        <div class="register-section">
            <a href="datosbasicos.html" class="back-arrow">&#8592;</a>
            
            <div class="form-container">
                <div class="logo-placeholder">
                    <img src="imagenes/riologo.png">
                </div>
                
                <h1>Registro</h1>
                
                <form id="registerForm">
                    <input type="email" id="correo" placeholder="Correo" required>
                    
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña" required>
                    
                    <button type="submit" class="btn-submit">Crear Cuenta</button>
                </form>
            </div>
            
            <div></div>
        </div>

        <div class="image-section">
            <img src="imagenes/credenciales.jpg">
        </div>

    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden. Por favor, verifícalas.');
                return; 
            }

            const correo = document.getElementById('correo').value;
            
            const nombre = localStorage.getItem('nombre') || 'N/A';
            const apellido = localStorage.getItem('apellido') || 'N/A';
            const estado = localStorage.getItem('estado') || 'N/A';
            const direccion = localStorage.getItem('direccion') || 'N/A';
            const identificacion = localStorage.getItem('identificacion') || 'N/A';
            const telefono = localStorage.getItem('telefono') || 'N/A';

            const contenidoTxt = 
`Nombre completo: ${nombre} ${apellido}
Estado: ${estado}
Dirección: ${direccion}
Identificación: ${identificacion}
Teléfono: ${telefono}
Correo: ${correo}
Contraseña: ${password}`;

            const blob = new Blob([contenidoTxt], { type: 'text/plain' });
            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = `registro_${nombre}_${apellido}.txt`; 

            document.body.appendChild(enlace);
            enlace.click(); 
            document.body.removeChild(enlace);

            window.location.href = 'cuentacreada.html';
        });
    </script>

</body>
</html>
