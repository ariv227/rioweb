<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="main-container">
        
        <div class="register-section">
            <a href="bienvenidos..html" class="back-arrow">&#8592;</a>
            
            <div class="form-container">
                <div class="logo-placeholder">
                    <img src="imagenes/riologo.png">
                </div>
                
                <h1>Registro</h1>
                
                <form id="basicDataForm">
                    <div class="form-row">
                        <input type="text" id="nombre" placeholder="Nombre" required>
                        <input type="text" id="estado" placeholder="Estado" required>
                    </div>
                    
                    <div class="form-row">
                        <input type="text" id="apellido" placeholder="Apellido" required>
                        <input type="text" id="direccion" placeholder="Dirección de envío" required>
                    </div>
                    
                    <div class="form-row">
                        <input type="text" id="identificacion" placeholder="Identificación" required>
                        <div></div> 
                    </div>
                    
                    <div class="form-row">
                        <input type="tel" id="telefono" placeholder="Numero de telefono" required>
                        <div></div> 
                    </div>

                    <div class="btn-submit-container">
                        <button type="submit" class="btn-submit">Siguiente</button>
                    </div>
                </form>
            </div>
            
            <div></div>
        </div>

        <div class="image-section">
            <img src="imagenes/datosbasicos.jpg">
        </div>

    </div>

    <script>
        document.getElementById('basicDataForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            localStorage.setItem('nombre', document.getElementById('nombre').value);
            localStorage.setItem('estado', document.getElementById('estado').value);
            localStorage.setItem('apellido', document.getElementById('apellido').value);
            localStorage.setItem('direccion', document.getElementById('direccion').value);
            localStorage.setItem('identificacion', document.getElementById('identificacion').value);
            localStorage.setItem('telefono', document.getElementById('telefono').value);
            
            window.location.href = 'credenciales.html';
        });
    </script>

</body>
</html>
